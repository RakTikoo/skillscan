name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Action pinning: both actions are pinned to a major version tag
      # (not a floating branch like @main). Major-version tags are the
      # balance this zero-dependency project uses: security fixes flow in
      # via Dependabot PRs (see .github/dependabot.yml) without the
      # maintenance cost of full SHA pinning.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipped samples
        run: python3 run_tests.py
      - name: Evasion mutations
        run: python3 run_mutation_tests.py
      - name: Edge cases
        run: python3 run_edge_tests.py
      - name: Security (hostile folders)
        run: python3 run_security_tests.py
      - name: v0.2 features (secrets, metadata, packages, SARIF, toolchain)
        run: python3 run_v02_tests.py
      - name: v0.3 features (hidden text, non-English phrases, concealment, sessions, bytecode honesty, env injection, OWASP)
        run: python3 run_v03_tests.py
      - name: v0.4 features (dependency sources, JS download-and-run, install prose, prose chains, read-and-disclose)
        run: python3 run_v04_tests.py
      - name: v0.4 fix pass (DoS perf, inert-text precision, lifecycle scoping, review evasions)
        run: python3 run_v04fix_tests.py
      - name: v0.5 features (prose chains, output manipulation, taint-lite, typosquat gate)
        run: python3 run_v05_tests.py
      - name: v0.5 fix pass (taint scope/flow, lure proximity, guard laundering, typosquat extraction)
        run: python3 run_v05fix_tests.py
      - name: v0.6 features (agent-config writes, agent credential reads)
        run: python3 run_v06_tests.py
      - name: v0.6 fix pass (mediation demotion, real-read discipline, red-team closures, timing)
        run: python3 run_v06fix_tests.py
      - name: v0.6 fix wave 2 (demotion hardening, folder mediation, resolver/verb gaps, audit-2 perf + stale-token)
        run: python3 run_v06fix2_tests.py
      - name: v0.7 features (optional LLM review mode, stub provider — no live API in CI)
        run: python3 run_v07_tests.py
